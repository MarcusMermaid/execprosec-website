<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press release | ExecProsec</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#111;--muted:#555;--red:#b00020;--line:#ddd;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Arial,Helvetica,sans-serif;padding:0 16px 80px}
main{max-width:680px;margin:0 auto}
.contact{font-size:13px;color:var(--muted);padding:22px 0 10px;border-bottom:1px solid var(--line)}
.contact b{color:var(--ink)}
.brand{font:700 12px/1 Arial,Helvetica,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--red);text-decoration:none}
#release{padding-top:18px}
#release img{max-width:100%;height:auto}
#release table{max-width:100%}
a{color:var(--red)}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.missing{padding:60px 0;color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="contact"><a class="brand" href="/">ExecProsec</a><br>
Marcus J Ball · Founder, ExecProsec · Private prosecutor &amp; legal reform campaigner ·
<b>07917 086231</b> · <a href="mailto:mjb@execprosec.com">mjb@execprosec.com</a></div>
<div id="release"><p class="missing">Loading the release…</p></div>
<div class="foot">Marcus J Ball · Founder, ExecProsec · <b>07917 086231</b> ·
<a href="mailto:mjb@execprosec.com">mjb@execprosec.com</a> · available for interview in studio or remotely</div>
</main>
<script>
(function () {
  var CENTRAL = "https://central-2-mcp-production.up.railway.app";
  var parts = location.pathname.replace(/\/+$/, "").split("/");
  var slug = (parts[2] || "").toLowerCase();
  var token = new URLSearchParams(location.search).get("t") || "";
  var box = document.getElementById("release");

  function missing() { box.innerHTML = '<p class="missing">This release is not available.</p>'; }
  if (!/^[a-z0-9][a-z0-9-]{2,60}$/.test(slug)) { missing(); return; }

  fetch(CENTRAL + "/public/press/release/" + slug).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data || !data.html) { missing(); return; }
      box.innerHTML = data.html;
      if (data.headline) document.title = data.headline + " | ExecProsec";
      if (token) track();
    }).catch(missing);

  // Reading: how far down, for how long while visible, with real scrolling.
  // Read to the end is judged by Central: 100% reached, 15+ seconds visible, 3+ real scrolls.
  function track() {
    var started = Date.now(), visibleMs = 0, visibleSince = document.visibilityState === "visible" ? started : 0;
    var maxDepth = 0, scrolls = 0, lastY = window.scrollY, sentMilestones = {}, human = false, beats = 0;

    function seconds() {
      return Math.round((visibleMs + (visibleSince ? Date.now() - visibleSince : 0)) / 1000);
    }
    function depth() {
      var doc = document.documentElement;
      var seen = (window.scrollY + window.innerHeight) / Math.max(doc.scrollHeight, 1) * 100;
      return Math.min(100, Math.round(seen >= 98 ? 100 : seen));
    }
    function send(kind) {
      var body = JSON.stringify({
        token: token, kind: kind, depth: maxDepth, seconds: seconds(), scroll_events: scrolls,
        visible: document.visibilityState === "visible", webdriver: navigator.webdriver === true,
        touch_or_mouse: human
      });
      try {
        if (!navigator.sendBeacon || !navigator.sendBeacon(CENTRAL + "/public/press/event", new Blob([body], { type: "text/plain" }))) {
          fetch(CENTRAL + "/public/press/event", { method: "POST", body: body, keepalive: true, headers: { "Content-Type": "text/plain" } });
        }
      } catch (e) {}
    }
    function onScroll() {
      if (window.scrollY !== lastY) { scrolls++; lastY = window.scrollY; }
      maxDepth = Math.max(maxDepth, depth());
      [25, 50, 75, 100].forEach(function (m) {
        if (maxDepth >= m && !sentMilestones[m]) { sentMilestones[m] = true; send("scroll"); }
      });
    }
    ["mousemove", "touchstart", "keydown", "wheel"].forEach(function (name) {
      window.addEventListener(name, function () { human = true; }, { passive: true, once: true });
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") { visibleSince = Date.now(); }
      else { if (visibleSince) { visibleMs += Date.now() - visibleSince; visibleSince = 0; } send("leave"); }
    });
    window.addEventListener("pagehide", function () { send("leave"); });
    window.addEventListener("scroll", onScroll, { passive: true });
    maxDepth = depth();
    send("view");
    var timer = setInterval(function () {
      if (++beats > 40) { clearInterval(timer); return; }
      if (document.visibilityState === "visible" && maxDepth >= 50) send("scroll");
    }, 15000);
  }
})();
</script>
</body>
</html>
